{% extends "base.html" %}

{% block content %}
<div class="text-center mb-4">
    <h2>Καλωσήρθες!</h2>
    <p class="text-muted">Διαχείριση Ομάδας</p>
</div>

<div class="row">
    <div class="col-6 col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h3 class="text-primary">{{ total }}</h3>
                <p class="mb-0">Ενεργά Παιδιά</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-3 mb-3">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h3 class="text-danger">{{ unpaid }}</h3>
                <p class="mb-0">Απλήρωτοι<br><small>{{ period }}</small></p>
            </div>
        </div>
    </div>
</div>

<div class="d-grid gap-2 mt-4">
    <a href="/members" class="btn btn-primary btn-lg">Παιδιά</a>
    <a href="/attendance" class="btn btn-success btn-lg">Παρουσιολόγιο</a>
    <a href="/payments" class="btn btn-info btn-lg">Πληρωμές</a>
    <a href="/unpaid" class="btn btn-warning btn-lg">Απλήρωτοι</a>
</div>
{% endblock %}
